<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AR Ping Pong V2</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}

#wrap{
  position:relative;
  width:100%;
  height:100%;
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#score{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  font-size:34px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  bottom:25px;
  left:0;
  width:100%;
  z-index:5;
  text-align:center;
  font-size:18px;
  text-shadow:0 2px 5px #000;
}

#startBtn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  font-size:24px;
  font-weight:bold;
  padding:18px 30px;
  border:0;
  border-radius:18px;
}
</style>
</head>

<body>

<div id="wrap">

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="score">0 : 0</div>

<div id="status">Press START CAMERA</div>

<button id="startBtn">START CAMERA 📷</button>

</div>

<script type="module">

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("status");

let W = 0;
let H = 0;

let handLandmarker = null;

let lastVideoTime = -1;

let playerScore = 0;
let aiScore = 0;

let targetPaddleX = 0;

const paddle = {
  x:0,
  y:0,
  w:120,
  h:24
};

const ai = {
  x:0,
  y:90,
  w:120,
  h:24
};

const ball = {
  x:0,
  y:0,
  r:15,
  vx:4,
  vy:6
};

function resize(){

  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;

  paddle.y = H - 110;

}

resize();

window.addEventListener("resize",resize);

function resetBall(){

  ball.x = W / 2;
  ball.y = H / 2;

  ball.vx =
    (Math.random() > 0.5 ? 1 : -1) * 12;

  ball.vy =
    (Math.random() > 0.5 ? 1 : -1) * 18;

}

function updateScore(){

  document.getElementById("score").textContent =
    playerScore + " : " + aiScore;

}

async function setupHandTracking(){

  statusText.textContent = "Loading hand tracking...";

  const vision =
    await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );

  handLandmarker =
    await HandLandmarker.createFromOptions(
      vision,
      {
        baseOptions:{
          modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate:"GPU"
        },

        runningMode:"VIDEO",
        numHands:1,

        minHandDetectionConfidence:0.5,
        minHandPresenceConfidence:0.5,
        minTrackingConfidence:0.5
      }
    );

  statusText.textContent = "Show your hand ✋";
}

async function startCamera(){

  startBtn.disabled = true;

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },
        audio:false
      });

    video.srcObject = stream;

    await video.play();

    await setupHandTracking();

    startBtn.style.display = "none";

    requestAnimationFrame(loop);

  }
  catch(err){

    console.error(err);

    statusText.textContent =
      "Camera error — allow camera permission";

    startBtn.disabled = false;

  }

}

startBtn.addEventListener("click",startCamera);

function detectHand(){

  if(
    !handLandmarker ||
    video.readyState < 2
  ){
    return;
  }

  if(video.currentTime === lastVideoTime){
    return;
  }

  lastVideoTime = video.currentTime;

  const result =
    handLandmarker.detectForVideo(
      video,
      performance.now()
    );

  if(
    result.landmarks &&
    result.landmarks.length > 0
  ){

    const hand = result.landmarks[0];

    // Landmark 9 = middle finger MCP.
    // Stable point near center of palm.
    const palm = hand[9];

    // Camera is mirrored.
    const screenX =
      (1 - palm.x) * W;

    targetPaddleX =
      screenX - paddle.w / 2;

    statusText.textContent =
      "HAND FOUND ✋";

    // Draw tracking dot
    ctx.beginPath();
    ctx.arc(
      screenX,
      palm.y * H,
      12,
      0,
      Math.PI * 2
    );

    ctx.fillStyle="yellow";
    ctx.fill();

  }
  else{

    statusText.textContent =
      "Show your hand ✋";

  }

}

function update(){

  // Smooth hand control
  paddle.x +=
    (targetPaddleX - paddle.x) * 0.35;

  if(paddle.x < 0)
    paddle.x = 0;

  if(paddle.x + paddle.w > W)
    paddle.x = W - paddle.w;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Side walls
  if(ball.x < ball.r){

    ball.x = ball.r;
    ball.vx *= -1;

  }

  if(ball.x > W - ball.r){

    ball.x = W - ball.r;
    ball.vx *= -1;

  }

  // AI
  ai.x +=
    (ball.x - ai.x - ai.w/2) * 0.07;

  if(ai.x < 0)
    ai.x = 0;

  if(ai.x + ai.w > W)
    ai.x = W - ai.w;

  // Player hit
  if(
    ball.vy > 0 &&
    ball.y + ball.r > paddle.y &&
    ball.y - ball.r < paddle.y + paddle.h &&
    ball.x > paddle.x &&
    ball.x < paddle.x + paddle.w
  ){

    ball.y =
      paddle.y - ball.r;

    ball.vy =
      -Math.abs(ball.vy);

    const hit =
      (ball.x -
      (paddle.x + paddle.w/2))
      /
      (paddle.w/2);

    ball.vx += hit * 3;

  }

  // AI hit
  if(
    ball.vy < 0 &&
    ball.y - ball.r < ai.y + ai.h &&
    ball.y + ball.r > ai.y &&
    ball.x > ai.x &&
    ball.x < ai.x + ai.w
  ){

    ball.y =
      ai.y + ai.h + ball.r;

    ball.vy =
      Math.abs(ball.vy);

  }

  // Player scores
  if(ball.y < -30){

    playerScore++;

    updateScore();
    resetBall();

  }

  // AI scores
  if(ball.y > H + 30){

    aiScore++;

    updateScore();
    resetBall();

  }

}

function draw(){

  ctx.clearRect(0,0,W,H);

  // Transparent AR table area
  ctx.fillStyle =
    "rgba(0,120,90,0.30)";

  ctx.fillRect(
    20,
    70,
    W-40,
    H-140
  );

  // Table border
  ctx.strokeStyle="white";
  ctx.lineWidth=3;

  ctx.strokeRect(
    20,
    70,
    W-40,
    H-140
  );

  // Net
  ctx.setLineDash([15,15]);

  ctx.beginPath();
  ctx.moveTo(20,H/2);
  ctx.lineTo(W-20,H/2);
  ctx.stroke();

  ctx.setLineDash([]);

  // AI paddle
  ctx.fillStyle="#4385ff";

  ctx.fillRect(
    ai.x,
    ai.y,
    ai.w,
    ai.h
  );

  // Player paddle
  ctx.fillStyle="#ff3131";

  ctx.fillRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h
  );

  // Ball
  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fillStyle="white";
  ctx.fill();

}

function loop(){

  draw();

  detectHand();

  update();

  requestAnimationFrame(loop);

}

targetPaddleX =
  W/2 - paddle.w/2;

paddle.x =
  targetPaddleX;

resetBall();

</script>

</body>
</html>
